  #wd-creator .link-box{display:flex;gap:8px;margin-bottom:14px}
  #wd-creator .link3{margin-bottom:14px}

  #wd-creator .link3-lbl span{font-weight:400;color:var(--text);font-size:12px}
  #wd-creator .link-box input{flex:1;font-size:13px;color:var(--ink2);background:var(--paper2)}
  #wd-creator .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:11px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;border:none;transition:.22s;text-decoration:none;letter-spacing:.02em}
  #wd-creator .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#fff;box-shadow:0 6px 18px rgba(184,151,74,.32)}
  #wd-creator .btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(184,151,74,.42)}
  #wd-creator .btn-wa{background:#25d366;color:#fff}
  #wd-creator .btn-wa:hover{transform:translateY(-1px);filter:brightness(1.05)}
  #wd-creator .btn-ghost{background:var(--paper2);color:var(--ink2);border:1px solid var(--line)}
  #wd-creator .btn-ghost:hover{border-color:var(--gold);color:var(--gold-dark)}
  #wd-creator .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  #wd-creator .btn-row .btn{flex:1;min-width:140px}
  #wd-creator .copied{font-size:12px;color:var(--sage);font-weight:600;margin-top:10px;opacity:0;transition:.3s}
  #wd-creator .copied.show{opacity:1}

  #wd-creator .save-note{margin-top:16px;padding:13px 15px;background:var(--gold-light);border-radius:12px;font-size:12px;color:var(--ink2);line-height:1.5}
  #wd-creator .save-note b{color:var(--gold-dark)}

  /* BARA DE JOS — înapoi la panou / clipuri (identic cu trackerele) */
  #wd-creator .bottom-bar{max-width:1180px;margin:8px auto 0;padding:22px 18px 0;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}

  #wd-creator .btn-back:hover{border-color:var(--gold);color:var(--gold-dark)}
</style>

    '<div class="ev-name">'+ph(D.locNume,'Localul')+'</div><div class="ev-time">'+ph(D.locOra,'Ora 20:00')+'</div><div class="ev-addr">'+ph(D.locAdr,'Adresa localului')+'</div>'+
    '<a class="map-btn" href="'+mapUrl(D.locHarta)+'" target="_blank">Vezi pe hartă</a></div></section>'+
    '<section class="ed" style="background:var(--emerald2)"><div class="ed-num" style="color:rgba(127,159,115,.16)">04</div><div class="ed-kicker">Până la marea zi</div><div class="ed-body">'+
    '<div class="cd-row"><div class="cd-cell"><div class="cd-num" data-cd="d">—</div><div class="cd-lab">zile</div></div><div class="cd-cell"><div class="cd-num" data-cd="h">—</div><div class="cd-lab">ore</div></div><div class="cd-cell"><div class="cd-num" data-cd="m">—</div><div class="cd-lab">minute</div></div></div></div></section>'+
    '<section class="rsvp">'+sprigSvg()+'<h2>Confirmă prezența</h2><p>Ne-ar face mare bucurie să te avem alături.</p><div class="rsvp-deadline">'+ph(D.deadline,'')+'</div>'+
    '<div class="btns"><button class="btn-ed">Voi fi prezent(ă)</button><button class="btn-ed btn-ghost">Din păcate, nu pot ajunge</button></div></section>'+
    '<div class="footer"><div class="rule" style="margin-bottom:18px"><span class="dot"></span></div><div class="f-names">'+ph(D.mireasa,'Maria')+' <span class="amp">&amp;</span> '+ph(D.mire,'Andrei')+'</div><div class="f-date">'+dataText()+'</div></div>'+
    '</div>'+cdScript()+'</body></html>';
  }

  function sprigSvg(){
    return '<svg class="sprig" viewBox="0 0 60 30" fill="none" style="margin-bottom:16px"><path d="M30 28V6" stroke="currentColor" stroke-width="1"/><path d="M30 14c-4-2-8-1-11-4M30 14c4-2 8-1 11-4M30 20c-3-1.5-6-1-8.5-3M30 20c3-1.5 6-1 8.5-3M30 8c-2-1-4-3-4-6M30 8c2-1 4-3 4-6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="4" r="2" fill="currentColor"/></svg>';
  }
  function cdScript(){
    var iso=dataIso();
    return '<script>(function(){var wd="'+iso+'";function t(){if(!/^\\d{4}-\\d{2}-\\d{2}/.test(wd))return;var df=new Date(wd)-new Date();if(df<0)df=0;var d=Math.floor(df/864e5),h=Math.floor(df%864e5/36e5),m=Math.floor(df%36e5/6e4);document.querySelectorAll("[data-cd=d]").forEach(function(e){e.textContent=d});document.querySelectorAll("[data-cd=h]").forEach(function(e){e.textContent=h});document.querySelectorAll("[data-cd=m]").forEach(function(e){e.textContent=m})}t();setInterval(t,6e4);})();<\/scr'+'ipt>';
  }

  var TEMPLATES={acuarela:tplAcuarela,editorial:tplEditorial,salvie:tplSalvie};
  var TPL_NAMES={acuarela:'Acuarelă',editorial:'Editorial',salvie:'Salvie'};

  // ═══ RANDARE în iframe ═══
  function renderPreview(){
    var iframe=document.getElementById('preview');
    var html=TEMPLATES[current]();
    iframe.srcdoc=html;
  }

  // ═══ LINK PARTAJABIL ═══
  // Funcțional ACUM: codează toate datele în URL (#...). Invitația se
  // deschide pe pagina-vizualizator (vezi [DEV]). Fără platformă.
  function buildShareLink(model){
    var m = model || current;
    // includ TOATE datele + pozele (URL-uri scurte de pe GHL, incap in link)
    var payload={ sablon_ales: m, date: {
      mireasa:D.mireasa, mire:D.mire, data:D.data, ora:D.ora, oras:D.oras, poveste:D.poveste,
      cover:D.cover, story:D.story,
      bisNume:D.bisNume, bisOra:D.bisOra, bisAdr:D.bisAdr, bisHarta:D.bisHarta,
      locNume:D.locNume, locOra:D.locOra, locAdr:D.locAdr, locHarta:D.locHarta,
      deadline:D.deadline, whatsapp:D.whatsapp
    }};
    var encoded=encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    var base='https://butcuu.github.io/wd/invitatie.html';
    return base+'#'+encoded;
  }
  function refreshLink(){
    // umplu cele 3 linkuri, fiecare cu modelul lui
    var a=document.getElementById('share-acuarela'); if(a) a.value=buildShareLink('acuarela');
    var e=document.getElementById('share-editorial'); if(e) e.value=buildShareLink('editorial');
    var s=document.getElementById('share-salvie'); if(s) s.value=buildShareLink('salvie');
    // numele modelului ales (pt WhatsApp)
    var cn=document.getElementById('chosen-name'); if(cn) cn.textContent=TPL_NAMES[current];
    // WhatsApp trimite modelul ales (tab activ)
    var waMsg=encodeURIComponent('Vă invităm la nunta noastră! 💛 Detaliile și confirmarea aici:\n'+buildShareLink(current));
    var wa=document.getElementById('btn-wa'); if(wa) wa.href='https://wa.me/?text='+waMsg;
  }

  // ═══ CITIRE FORMULAR ═══
  function bindInput(id,key,after){
    var el=document.getElementById(id);
    if(!el) return;
    el.addEventListener('input',function(){ D[key]=el.value; if(after)after(); scheduleRender(); });
  }
  bindInput('f-mireasa','mireasa'); bindInput('f-mire','mire');
  bindInput('f-data','data'); bindInput('f-ora','ora'); bindInput('f-oras','oras');
  bindInput('f-poveste','poveste');
  bindInput('f-bis-nume','bisNume'); bindInput('f-bis-ora','bisOra'); bindInput('f-bis-adr','bisAdr'); bindInput('f-bis-harta','bisHarta');
  bindInput('f-loc-nume','locNume'); bindInput('f-loc-ora','locOra'); bindInput('f-loc-adr','locAdr'); bindInput('f-loc-harta','locHarta');
  bindInput('f-deadline','deadline'); bindInput('f-whatsapp','whatsapp',refreshLink);

  // pornesc ora implicită
  D.ora=document.getElementById('f-ora').value||'17:00';

  // ═══ UPLOAD POZE (preview local prin DataURL) ═══
  function bindPhoto(inputId,thumbId,key){
    var inp=document.getElementById(inputId), thumb=document.getElementById(thumbId);
    inp.addEventListener('change',function(){
      var file=inp.files&&inp.files[0]; if(!file)return;
      var reader=new FileReader();
      reader.onload=function(e){ thumb.src=e.target.result; thumb.classList.remove('empty'); };
      reader.readAsDataURL(file);
      wdUploadPhoto(file, function(url){
        D[key]=url; thumb.src=url; thumb.classList.remove('empty'); scheduleRender();
      }, function(){ alert('Poza nu s-a putut urca. Mai încearcă cu o poză mai mică.'); });
    });
  }
  bindPhoto('up-cover','thumb-cover','cover');
  bindPhoto('up-story','thumb-story','story');

  // ═══ TAB-URI (alegerea șablonului) ═══
  root.querySelectorAll('.tab').forEach(function(tab){
    tab.addEventListener('click',function(){
      root.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      current=tab.getAttribute('data-tpl');
      renderPreview(); refreshLink();
    });
  });

  // ═══ COPY LINK (cele 3 butoane) ═══
  root.querySelectorAll('.btn-copy3').forEach(function(b){
    b.addEventListener('click',function(){
      var inp=document.getElementById(b.getAttribute('data-copy'));
      if(!inp) return;
      inp.select(); inp.setSelectionRange(0,99999);
      try{ document.execCommand('copy'); }catch(e){}
      if(navigator.clipboard){ navigator.clipboard.writeText(inp.value).catch(function(){}); }
      var msg=document.getElementById('copied-msg'); msg.classList.add('show');
      setTimeout(function(){msg.classList.remove('show');},2500);
    });
  });

  // ═══ SALVARE ═══
  document.getElementById('btn-save').addEventListener('click',function(){
    wdSaveInvitatie();
  });

  // randare cu debounce (ca să nu re-randeze la fiecare tastă)
  var rt;
  function scheduleRender(){ clearTimeout(rt); rt=setTimeout(function(){ renderPreview(); refreshLink(); },220); }

  // randare inițială — după ce încărcăm datele salvate
  wdLoadInvitatie(function(){
    try{
      var map={'f-mireasa':'mireasa','f-mire':'mire','f-data':'data','f-ora':'ora','f-oras':'oras','f-poveste':'poveste','f-bis-nume':'bisNume','f-bis-ora':'bisOra','f-bis-adr':'bisAdr','f-bis-harta':'bisHarta','f-loc-nume':'locNume','f-loc-ora':'locOra','f-loc-adr':'locAdr','f-loc-harta':'locHarta','f-deadline':'deadline','f-whatsapp':'whatsapp'};
      Object.keys(map).forEach(function(id){ var e=document.getElementById(id); if(e&&D[map[id]]!=null&&D[map[id]]!=="") e.value=D[map[id]]; });
      if(D.cover){ var tc=document.getElementById('thumb-cover'); if(tc){tc.src=D.cover;tc.classList.remove('empty');} }
      if(D.story){ var ts=document.getElementById('thumb-story'); if(ts){ts.src=D.story;ts.classList.remove('empty');} }
      root.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-tpl')===current); });
    }catch(e){}
    renderPreview(); refreshLink();
  });

  // ════════════════════════════════════════════════════════════════
  // ║                  PENTRU DEZVOLTATORII PLATFORMEI               ║
  // ════════════════════════════════════════════════════════════════
  //
  // Acest panel are 3 funcții care depind de platformă (GHL). Mai jos,
  // ce face fiecare și ce trebuie să conectați.
  //
  // ───────────────────────────────────────────────────────────────
  // 1) SALVAREA DATELOR ÎN CONTUL MIRESEI
  // ───────────────────────────────────────────────────────────────
  // Obiectul D conține tot ce a completat mireasa (nume, dată, locații,
  // text, + pozele ca DataURL base64). La click pe "Salvează invitația"
  // se cheamă wdSaveInvitatie() de mai jos.
  //
  // RECOMANDAT: salvați D ca JSON într-un custom field GHL pe contactul
  // miresei (ex. "invitatie_json"), via webhook. ATENȚIE la poze:
  // DataURL-urile sunt mari — ideal le încărcați separat în storage
  // (GHL media / S3) și păstrați doar URL-urile în JSON.
  //
  function wdSaveInvitatie(){
    var payload={ sablon_ales: current, date: D };
    if(!WD_CID){ alert('Nu te-am putut identifica — deschide pagina din contul tău (din panou).'); return; }
    var btn=document.getElementById('btn-save'); var old=btn?btn.textContent:'';
    if(btn){ btn.disabled=true; btn.textContent='Se salvează...'; }
    fetch(WD_API+"?cid="+encodeURIComponent(WD_CID),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ invitatieJson: JSON.stringify(payload) })
    })
    .then(function(r){return r.json();})
    .then(function(j){
      if(btn){ btn.disabled=false; btn.textContent=old; }
      if(j&&(j.ok||j.salvat)){ try{ window.name='WD_INV:'+JSON.stringify(payload); }catch(e){}
        alert('Invitația ta a fost salvată în contul tău! ✓'); }
      else alert('Nu s-a putut salva. Mai încearcă.');
    })
    .catch(function(){ if(btn){ btn.disabled=false; btn.textContent=old; } alert('Eroare la salvare.'); });
  }
  //
  // ───────────────────────────────────────────────────────────────
  // 2) LINKUL PUBLIC AL INVITAȚIEI
  // ───────────────────────────────────────────────────────────────
  // CUM MERGE ACUM (fără platformă): buildShareLink() codează toate
  // datele text în URL după #. Trebuie o PAGINĂ-VIZUALIZATOR la
  // weddingdirection.ro/invitatie care:
  //   - citește location.hash, face atob() + JSON.parse()
  //   - randează șablonul ales cu aceleași funcții tplAcuarela/tplEditorial/tplSalvie
  // (pozele NU încap în URL — vezi punctul 1: serviți-le din storage și
  //  puneți URL-urile în payload).
  //
  // VARIANTA CURATĂ (RECOMANDAT): la salvare generați un slug unic
  // (ex. /invitatie/maria-andrei-x7g2) servit de platformă din datele
  // salvate. Înlocuiți 'base' din buildShareLink() cu acel URL.
  //
  // ───────────────────────────────────────────────────────────────
  // 3) CONFIRMĂRILE (RSVP) — vezi fișierele individuale ale șabloanelor
  // ───────────────────────────────────────────────────────────────
  // În invitația publică, butoanele RSVP trimit răspunsul fie pe WhatsApp
  // (gata), fie la un webhook (recomandat). Vezi funcția wdRSVP în fiecare
  // șablon. WhatsApp-ul miresei vine din câmpul completat aici (D.whatsapp).
  // ════════════════════════════════════════════════════════════════

})();

</script>









<script>
(function(){
  var last = 0;
  function send(){
    try {
      var h = Math.max(
        document.documentElement.scrollHeight,
        document.body ? document.body.scrollHeight : 0,
        document.documentElement.offsetHeight
      );
      if (h > 100 && Math.abs(h - last) > 3) {
        last = h;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ wdHeight: h }, "*");
        }
      }
    } catch(e){}
  }
  // raportez la load + dupa asezarea fonturilor/imaginilor
  if (document.readyState === "complete") send();
  else window.addEventListener("load", send);
  // raportez PERMANENT (lejer) - prinde orice schimbare, oricat de tarziu
  setInterval(send, 500);
  // si imediat la schimbari de continut
  try {
    if (window.ResizeObserver) {
      new ResizeObserver(send).observe(document.documentElement);
    }
  } catch(e){}
})();
</script>

<!-- WD-NAV-TOP v1 - navigare la nivel de fereastra de sus.
     Butoanele catre portal si catre checkout nu mai incarca pagina in interiorul
     iframe-ului. Fara asta, pe mobil scroll-ul ramane parcat si pare pagina goala. -->
<script>
(function(){
"use strict";
if(window.__wdNavTop) return;
window.__wdNavTop = 1;

function goTop(url){
  try{
    if(window.top && window.top !== window){ window.top.location.href = url; return; }
  }catch(e){}
  location.href = url;
}

function isPortal(href){
  return href.indexOf("clientclub.net") > -1 || href.indexOf("weddingdirection.ro") > -1;
}

function mark(){
  var a = document.querySelectorAll("a[href]");
  for(var i=0;i<a.length;i++){
    var h = a[i].getAttribute("href") || "";
    if(isPortal(h)) a[i].setAttribute("target","_top");
  }
}

document.addEventListener("click", function(e){
  var t = e.target;
  var a = (t && t.closest) ? t.closest("a[href]") : null;
  if(!a) return;
  var h = a.getAttribute("href") || "";
  if(!isPortal(h)) return;
  e.preventDefault();
  goTop(a.href);
}, true);

mark();
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", mark);
setInterval(mark, 800);

})();
</script>

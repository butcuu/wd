<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invitație de nuntă</title>
</head>
<body>
<div id="wd-err" style="display:none;max-width:500px;margin:80px auto;text-align:center;padding:30px;color:#5a4a44;font-family:Georgia,serif"><h1>Invitație indisponibilă</h1><p>Linkul pare incomplet. Cere mirilor un link nou.</p></div>
<script>
(function(){
  "use strict";
  var D = { mireasa:'',mire:'',data:'',ora:'17:00',oras:'',cover:'',story:'',poveste:'',
    bisNume:'',bisOra:'',bisAdr:'',bisHarta:'',locNume:'',locOra:'',locAdr:'',locHarta:'',deadline:'',whatsapp:'' };
  var current = 'acuarela';
  function wdDecode(raw){
    if(!raw) return null;
    var tries = [];
    try { tries.push(decodeURIComponent(raw)); } catch(e){}
    tries.push(raw);
    for(var i=0;i<tries.length;i++){
      var s = tries[i].replace(/-/g,'+').replace(/_/g,'/');
      while(s.length % 4) s += '=';
      try {
        var bin = atob(s);
        var json; try { json = decodeURIComponent(escape(bin)); } catch(e){ json = bin; }
        var p = JSON.parse(json);
        if(p) return p;
      } catch(e){}
    }
    return null;
  }

var PH_COVER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900"><rect width="800" height="900" fill="#e9e0d2"/><text x="400" y="450" font-family="Georgia" font-size="34" fill="#b8a98c" text-anchor="middle">Poza voastră</text></svg>');

var PH_STORY='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="500" height="600"><rect width="500" height="600" fill="#ece3d5"/><text x="250" y="300" font-family="Georgia" font-size="24" fill="#b8a98c" text-anchor="middle">Poza poveste</text></svg>');

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function dataText(){
    if(!D.data) return 'Data nunții';
    var luni=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
    var p=D.data.split('-'); // AAAA-LL-ZZ
    if(p.length!==3) return D.data;
    return parseInt(p[2],10)+' '+luni[parseInt(p[1],10)-1]+' '+p[0];
  }

function dataIso(){ return D.data ? (D.data+'T'+(D.ora||'17:00')) : ''; }

function waNum(){ return (D.whatsapp||'').replace(/[^0-9]/g,'').replace(/^0/,'40'); }

function mapUrl(q){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q||''); }

function ph(v,fallback){ return v ? esc(v) : fallback; }

function commonHead(fonts){
    return '<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link href="https://fonts.googleapis.com/css2?family='+fonts+'&display=swap" rel="stylesheet">';
  }

function cdScript(){
    var iso=dataIso();
    return '<script>(function(){var wd="'+iso+'";function t(){if(!/^\\d{4}-\\d{2}-\\d{2}/.test(wd))return;var df=new Date(wd)-new Date();if(df<0)df=0;var d=Math.floor(df/864e5),h=Math.floor(df%864e5/36e5),m=Math.floor(df%36e5/6e4);document.querySelectorAll("[data-cd=d]").forEach(function(e){e.textContent=d});document.querySelectorAll("[data-cd=h]").forEach(function(e){e.textContent=h});document.querySelectorAll("[data-cd=m]").forEach(function(e){e.textContent=m})}t();setInterval(t,6e4);})();<\/scr'+'ipt>';
  }

function sprigSvg(){
    return '<svg class="sprig" viewBox="0 0 60 30" fill="none" style="margin-bottom:16px"><path d="M30 28V6" stroke="currentColor" stroke-width="1"/><path d="M30 14c-4-2-8-1-11-4M30 14c4-2 8-1 11-4M30 20c-3-1.5-6-1-8.5-3M30 20c3-1.5 6-1 8.5-3M30 8c-2-1-4-3-4-6M30 8c2-1 4-3 4-6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="30" cy="4" r="2" fill="currentColor"/></svg>';
  }

function tplAcuarela(){
    var cover=D.cover||PH_COVER, story=D.story||PH_STORY;
    return '<!DOCTYPE html><html lang="ro"><head>'+commonHead('Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500|Jost:wght@300;400;500')+
    '<style>'+
    ':root{--blush:#e8c4bd;--blush-soft:#f7e9e5;--blush-deep:#c98d7c;--sage:#a9bba0;--sage-soft:#eef3ea;--sage-deep:#7f9f73;--cream:#fdf8f4;--cream2:#f9efe9;--ink:#5a4a44;--ink-soft:#8a7873;--muted:#b3a39d;--line:rgba(201,141,124,.25);--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",sans-serif}'+
    '*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.7;font-weight:300}'+
    '.inv{max-width:640px;margin:0 auto;background:var(--cream);position:relative}'+
    '.inv::before{content:"";position:fixed;top:-60px;right:-60px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(232,196,189,.35),transparent 65%);pointer-events:none}'+
    '.inv::after{content:"";position:fixed;bottom:-80px;left:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(169,187,160,.3),transparent 65%);pointer-events:none}'+
    '.cover{position:relative;min-height:96vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:50px 32px;z-index:1}'+
    '.cover-photo{width:230px;height:300px;border-radius:140px 140px 0 0;object-fit:cover;margin:0 auto 32px;border:5px solid #fff;box-shadow:0 16px 50px rgba(201,141,124,.28)}'+
    '.cover .pre{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--blush-deep);margin-bottom:16px}'+
    '.cover .names{font-family:var(--serif);font-size:clamp(42px,11vw,60px);font-weight:500;line-height:1.1;color:var(--ink)}'+
    '.cover .amp{font-style:italic;color:var(--blush-deep)}'+
    '.cover .date{margin-top:20px;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--sage-deep)}'+
    '.cover .leaf{font-size:26px;color:var(--sage);margin-bottom:8px}'+
    '.tl-wrap{padding:30px 24px 40px;position:relative;z-index:1}'+
    '.tl-intro{text-align:center;margin-bottom:10px}.tl-intro .leaf{font-size:24px;color:var(--sage)}'+
    '.tl-intro p{font-family:var(--serif);font-size:22px;font-style:italic;color:var(--ink);max-width:28ch;margin:14px auto 0}'+
    '.timeline{max-width:480px;margin:34px auto 0}'+
    '.moment{padding:24px 0;display:flex;flex-direction:column;align-items:center;text-align:center}'+
    '.moment .dot{width:48px;height:48px;border-radius:50%;background:var(--cream);border:2px solid var(--blush);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px;box-shadow:0 4px 14px rgba(201,141,124,.2)}'+
    '.moment.sage .dot{border-color:var(--sage)}'+
    '.moment .m-label{font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--blush-deep);font-weight:500;margin-bottom:6px}.moment.sage .m-label{color:var(--sage-deep)}'+
    '.moment .m-title{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--ink);margin-bottom:4px}'+
    '.moment .m-time{font-size:13px;color:var(--blush-deep);font-weight:500;margin-bottom:8px}'+
    '.moment .m-text{font-size:14px;color:var(--ink-soft);max-width:34ch;margin:0 auto}'+
    '.moment .m-photo{width:160px;height:160px;border-radius:50%;object-fit:cover;margin:14px auto 0;border:4px solid #fff;box-shadow:0 8px 26px rgba(201,141,124,.22)}'+
    '.map-btn{display:inline-flex;gap:7px;margin-top:14px;padding:10px 22px;border:1px solid var(--blush-deep);border-radius:999px;color:var(--blush-deep);font-size:11px;font-weight:500;text-decoration:none;letter-spacing:.1em;text-transform:uppercase}'+
    '.moment.sage .map-btn{border-color:var(--sage-deep);color:var(--sage-deep)}'+
    '.cd-grid{display:flex;justify-content:center;gap:20px;margin-top:6px}'+
    '.cd-num{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--blush-deep)}'+
    '.cd-lab{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:4px}'+
    '.rsvp{text-align:center;padding:46px 30px;background:var(--cream2);position:relative;z-index:1;border:1px solid var(--line);border-radius:28px;margin:20px 18px 36px}'+
    '.rsvp .leaf{font-size:24px;color:var(--sage);margin-bottom:10px}'+
    '.rsvp h2{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--ink);margin-bottom:8px}'+
    '.rsvp p{font-size:14px;color:var(--ink-soft);max-width:32ch;margin:0 auto 14px}'+
    '.rsvp-deadline{font-size:12px;color:var(--blush-deep);font-weight:500;margin-bottom:20px}'+
    '.btns{display:flex;flex-direction:column;gap:11px;align-items:center}'+
    '.btn-soft{padding:14px 38px;border:none;border-radius:999px;background:linear-gradient(135deg,var(--blush-deep),var(--blush));color:#fff;font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.08em;box-shadow:0 8px 24px rgba(201,141,124,.35)}'+
    '.btn-ghost{background:transparent;border:1px solid var(--sage-deep);color:var(--sage-deep);box-shadow:none;font-size:12px;padding:11px 28px;border-radius:999px}'+
    '.footer{text-align:center;padding:36px 32px;position:relative;z-index:1}.footer .f-leaf{font-size:22px;color:var(--sage);margin-bottom:10px}'+
    '.footer .f-names{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink)}'+
    '.footer .f-date{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:6px}'+
    '</style></head><body><div class="inv">'+
    '<div class="cover"><img class="cover-photo" src="'+cover+'"><div class="leaf">❧</div><div class="pre">Vă invităm la nunta noastră</div>'+
    '<div class="names">'+ph(D.mireasa,'Maria')+' <span class="amp">&amp;</span> '+ph(D.mire,'Andrei')+'</div><div class="date">'+dataText()+'</div></div>'+
    '<div class="tl-wrap"><div class="tl-intro"><div class="leaf">❧</div><p>Fiecare poveste are un început. A noastră ne-a adus până aici.</p></div>'+
    '<div class="timeline">'+
    '<div class="moment"><div class="dot">💛</div><div class="m-label">Povestea noastră</div><div class="m-text">'+ph(D.poveste,'Câteva rânduri despre povestea voastră vor apărea aici.')+'</div><img class="m-photo" src="'+story+'"></div>'+
    '<div class="moment sage"><div class="dot">⛪</div><div class="m-label">Ceremonia religioasă</div><div class="m-title">'+ph(D.bisNume,'Biserica')+'</div><div class="m-time">'+ph(D.bisOra,'Ora 18:00')+'</div><div class="m-text">'+ph(D.bisAdr,'Adresa bisericii')+'</div><a class="map-btn" href="'+mapUrl(D.bisHarta)+'" target="_blank">📍 Vezi pe hartă</a></div>'+
    '<div class="moment"><div class="dot">🥂</div><div class="m-label">Petrecerea</div><div class="m-title">'+ph(D.locNume,'Localul')+'</div><div class="m-time">'+ph(D.locOra,'Ora 20:00')+'</div><div class="m-text">'+ph(D.locAdr,'Adresa localului')+'</div><a class="map-btn" href="'+mapUrl(D.locHarta)+'" target="_blank">📍 Vezi pe hartă</a></div>'+
    '<div class="moment"><div class="dot">⏳</div><div class="m-label">Până la marea zi</div><div class="cd-grid"><div><div class="cd-num" data-cd="d">—</div><div class="cd-lab">zile</div></div><div><div class="cd-num" data-cd="h">—</div><div class="cd-lab">ore</div></div><div><div class="cd-num" data-cd="m">—</div><div class="cd-lab">minute</div></div></div></div>'+
    '</div></div>'+
    '<section class="rsvp"><div class="leaf">❧</div><h2>Confirmă prezența</h2><p>Ne-ar bucura nespus să te avem alături.</p><div class="rsvp-deadline">'+ph(D.deadline,'')+'</div>'+
    '<div class="btns"><button class="btn-soft">Voi fi prezent(ă)</button><button class="btn-soft btn-ghost">Din păcate, nu pot ajunge</button></div></section>'+
    '<div class="footer"><div class="f-leaf">❧</div><div class="f-names">'+ph(D.mireasa,'Maria')+' &amp; '+ph(D.mire,'Andrei')+'</div><div class="f-date">'+dataText()+'</div></div>'+
    '</div>'+cdScript()+'</body></html>';
  }

function tplEditorial(){
    var cover=D.cover||PH_COVER, story=D.story||PH_STORY;
    return '<!DOCTYPE html><html lang="ro"><head>'+commonHead('Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400|Jost:wght@300;400;500')+
    '<style>'+
    ':root{--ivory:#f5f1ea;--ivory2:#ece5da;--paper:#fbf8f2;--ink:#262019;--ink2:#473e34;--muted:#8a7d6c;--gold:#a8895a;--gold-light:#c9b083;--line:#d8cdbd;--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost",sans-serif}'+
    '*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--sans);color:var(--ink);background:var(--ivory);line-height:1.7;font-weight:300}'+
    '.inv{max-width:720px;margin:0 auto;background:var(--paper)}'+
    '.sprig{display:block;margin:0 auto;color:var(--gold);width:54px}'+
    '.rule{display:flex;align-items:center;gap:14px;justify-content:center;margin:0 auto;max-width:240px}.rule::before,.rule::after{content:"";height:1px;background:var(--gold);flex:1;opacity:.5}.rule .dot{width:5px;height:5px;border:1px solid var(--gold);transform:rotate(45deg)}'+

    '.cover-band{position:relative;padding:26px 18px 30px;text-align:left;flex:1;display:flex;flex-direction:column;justify-content:center}'+
    '.cover-band::before{content:"";position:absolute;top:14px;left:18px;right:18px;height:1px;background:var(--gold);opacity:.4}'+

    'section{padding:58px 36px;position:relative}.ed{position:relative}'+
    '.ed-num{font-family:var(--serif);font-size:120px;font-weight:300;line-height:.8;color:var(--ivory2);position:absolute;top:-18px;right:0;user-select:none}'+
    '.ed-kicker{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:10px;position:relative}'+
    '.ed-body{position:relative}'+
    '.intro-q{font-family:var(--serif);font-size:26px;font-style:italic;color:var(--ink2);line-height:1.5;max-width:32ch}'+

    '.story-grid .st-text{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--ink2);line-height:1.65}'+
    '.ev-name{font-family:var(--serif);font-size:30px;font-weight:500;color:var(--ink);margin-bottom:4px}'+

    '.rsvp p{font-size:14px;color:#cdc2b3;max-width:32ch;margin:0 auto 14px}'+
    '.rsvp-deadline{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-light);font-weight:500;margin-bottom:22px}'+
    '.btns{display:flex;flex-direction:column;gap:12px;align-items:center}'+
    '.btn-ed{padding:15px 42px;border:1px solid var(--gold-light);background:transparent;color:var(--gold-light);font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase}'+
    '.btn-ghost{border-color:rgba(216,205,189,.4);color:#cdc2b3;font-size:10px;padding:12px 30px}'+
    '.footer{text-align:center;padding:44px 36px;background:var(--paper)}.footer .f-names{font-family:var(--serif);font-size:30px;font-weight:400;color:var(--ink)}.footer .f-names .amp{font-style:italic;color:var(--gold)}.footer .f-date{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:8px}'+

    '<a class="map-btn" href="'+mapUrl(D.locHarta)+'" target="_blank">Vezi pe hartă</a></div></section>'+
    '<section class="ed" style="background:var(--ivory2)"><div class="ed-num" style="color:#e2d9cb">04</div><div class="ed-kicker">Până la marea zi</div><div class="ed-body">'+
    '<div class="cd-row"><div class="cd-cell"><div class="cd-num" data-cd="d">—</div><div class="cd-lab">zile</div></div><div class="cd-cell"><div class="cd-num" data-cd="h">—</div><div class="cd-lab">ore</div></div><div class="cd-cell"><div class="cd-num" data-cd="m">—</div><div class="cd-lab">minute</div></div></div></div></section>'+

var TEMPLATES={acuarela:tplAcuarela,editorial:tplEditorial,salvie:tplSalvie};

  var hash = location.hash.replace(/^#/, '');
  var payload = wdDecode(hash);
  if(payload){
    if(payload.date) D = Object.assign(D, payload.date);
    else D = Object.assign(D, payload);
    if(payload.sablon_ales) current = payload.sablon_ales;
    else if(payload.t) current = payload.t;
  }
  if(payload){
    try {
      var fn = TEMPLATES[current] || TEMPLATES.acuarela;
      document.open(); document.write(fn()); document.close();
    } catch(e){ document.getElementById('wd-err').style.display='block'; }
  } else { document.getElementById('wd-err').style.display='block'; }
})();

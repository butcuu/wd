<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Wedding Direction — Tracker buget</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
#wd-buget *{margin:0;padding:0;box-sizing:border-box}
#wd-buget{
  --gold:#b7934f;--gold-dark:#9b7938;--gold-soft:#f6eedf;
  --rose:#c98d7c;--rose-soft:#fbefeb;--sage:#7f9f73;--sage-soft:#eef5eb;
  --blue:#7392b3;--blue-soft:#edf3f9;
  --ink:#2b2622;--ink2:#4d443c;--text:#4f463f;--muted:#8f8478;
  --paper:#fcf8f3;--card:#fff;--line:#e9e0d2;
  font-family:'Inter',sans-serif;color:var(--text);background:var(--paper);
  min-height:100vh;padding:24px 16px 60px;line-height:1.6;
}
#wd-buget .serif{font-family:'Cormorant Garamond',serif}
#wd-buget .topbar{height:5px;background:linear-gradient(90deg,var(--gold),var(--rose),var(--gold));border-radius:5px;max-width:1000px;margin:0 auto 22px}
#wd-buget .head{max-width:1000px;margin:0 auto 8px;text-align:center}
#wd-buget .brand{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
#wd-buget .brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--rose);margin-top:2px;font-weight:500}
#wd-buget .back-link{display:inline-block;margin-top:12px;color:var(--text);text-decoration:none;font-size:13px;font-weight:600}
#wd-buget .back-link:hover{color:var(--gold-dark)}
#wd-buget .pill{display:inline-block;margin-top:14px;background:var(--gold-soft);color:var(--gold-dark);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:6px 16px;border-radius:20px}
#wd-buget h1{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;color:var(--ink);text-align:center;margin:14px auto 6px;max-width:1000px;line-height:1.1}
#wd-buget .sub{text-align:center;max-width:600px;margin:0 auto 26px;font-size:15px}

/* setari sus */
#wd-buget .setup{max-width:1000px;margin:0 auto 22px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;justify-content:center}
#wd-buget .setup .f{display:flex;flex-direction:column;gap:5px}
#wd-buget .setup label{font-size:12px;font-weight:600;color:var(--ink)}
#wd-buget .setup input{border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--paper);width:130px}
#wd-buget .setup input:focus{outline:none;border-color:var(--gold);background:#fff}
#wd-buget .setup .cur-toggle{display:flex;gap:0;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
#wd-buget .setup .cur-toggle button{border:none;background:#fff;padding:9px 16px;font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
#wd-buget .setup .cur-toggle button.on{background:var(--gold);color:#fff}

/* sumar */
#wd-buget .summary{max-width:1000px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){#wd-buget .summary{grid-template-columns:1fr 1fr}}
#wd-buget .sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center}
#wd-buget .sc .l{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
#wd-buget .sc .v{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:3px}
#wd-buget .sc.est .v{color:var(--gold-dark)} 
#wd-buget .sc.contr .v{color:var(--blue)}
#wd-buget .sc.plat .v{color:var(--sage)}
#wd-buget .sc.cpp .v{color:var(--rose)}

/* tabel categorii */
#wd-buget .cats{max-width:1000px;margin:0 auto}
#wd-buget .cat-head,#wd-buget .cat-row{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:10px;align-items:center}
#wd-buget .cat-head{padding:0 16px 8px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
#wd-buget .cat-head span:not(:first-child){text-align:center}
#wd-buget .cat-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:9px}
#wd-buget .cat-name{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--ink);font-size:14.5px}
#wd-buget .cat-name .ce{font-size:18px}
#wd-buget .cat-row input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:var(--paper);text-align:center}
#wd-buget .cat-row input:focus{outline:none;border-color:var(--gold);background:#fff}
#wd-buget .cat-row.custom .cat-name input{text-align:left;font-weight:600}
#wd-buget .add-row{max-width:1000px;margin:4px auto 0;text-align:center}
#wd-buget .add-row button{background:var(--gold-soft);border:none;color:var(--gold-dark);font-weight:600;font-size:13px;padding:10px 20px;border-radius:20px;cursor:pointer;font-family:'Inter',sans-serif}
#wd-buget .add-row button:hover{background:var(--gold);color:#fff}
#wd-buget .cat-del{background:none;border:none;color:var(--rose);cursor:pointer;font-size:16px;padding:0 4px}

/* alerta depasire */
#wd-buget .alert{max-width:1000px;margin:16px auto 0;padding:14px 18px;border-radius:12px;font-size:14px;font-weight:500;text-align:center;display:none}
#wd-buget .alert.over{display:block;background:var(--rose-soft);color:#a85b48;border:1px solid #e8c4b8}
#wd-buget .alert.ok{display:block;background:var(--sage-soft);color:#5a7150;border:1px solid #cfe0c5}

/* bara jos */
#wd-buget .bottom-bar{max-width:1000px;margin:26px auto 0;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
#wd-buget .btn-back{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);color:var(--ink2);font-size:13px;font-weight:700;text-decoration:none;transition:.2s}
#wd-buget .btn-back:hover{border-color:var(--gold);color:var(--gold-dark)}

/* save bar */
#wd-buget .savebar{position:fixed;bottom:0;left:0;right:0;background:rgba(252,248,243,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:center;gap:14px;z-index:50}
#wd-buget .save-status{font-size:13px;color:var(--text)}
#wd-buget .btn-save{background:var(--gold);color:#fff;font-weight:600;padding:11px 28px;border-radius:24px;border:none;cursor:pointer;font-size:14px;font-family:'Inter',sans-serif}
#wd-buget .btn-save:hover{background:var(--gold-dark)}
#wd-buget .btn-save:disabled{opacity:.5;cursor:default}
#wd-buget .state{max-width:560px;margin:40px auto;text-align:center;padding:30px;background:#fff;border:1px solid var(--line);border-radius:16px}
#wd-buget .state .ic{font-size:36px;margin-bottom:12px}
#wd-buget .state h2{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--ink);margin-bottom:8px}
@media(max-width:600px){#wd-buget h1{font-size:30px}}
</style>
</head>
<body>
<div id="wd-buget">

  <div class="topbar"></div>
  <div class="head">
    <div class="brand">Wedding Direction<small>by Oana</small></div>
    <div><a class="back-link" data-nav="panou" href="#">← Înapoi la panou</a></div>
    <div class="pill">Tracker buget</div>
  </div>
  <h1 class="serif">Banii sub control, pe categorii</h1>
  <p class="sub">Estimează, notează ce ai contractat și ce ai achitat. Vezi pe loc dacă te încadrezi.</p>

  <div id="wd-root">
    <div class="state"><div class="ic">⏳</div><h2 class="serif">Se încarcă...</h2></div>
  </div>

  <div class="savebar" id="wd-savebar" style="display:none">
    <span class="save-status" id="wd-status"></span>
    <button class="btn-save" id="wd-save">💾 Salvează bugetul</button>
  </div>

</div>

<script>
(function(){
  "use strict";
  var WD_API="https://weddingdirection--29098e585ebd11f1bac21607ee4eb77e.web.val.run";

  function wdGetCid(){
    try{ var p=new URLSearchParams(location.search); if(p.get("cid")) return p.get("cid"); }catch(e){}
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&k.indexOf("firebase:authUser")>-1){
          var d=JSON.parse(localStorage.getItem(k));
          if(d&&d.stsTokenManager&&d.stsTokenManager.accessToken){
            var pl=JSON.parse(atob(d.stsTokenManager.accessToken.split(".")[1].replace(/-/g,'+').replace(/_/g,'/')));
            if(pl.contact_id) return pl.contact_id;
          }
        }
      }
    }catch(e){}
    return null;
  }
  var WD_CID=wdGetCid();

  // ── navigare ──
  (function(){
    var LB="https://vsu1yqyciwfpxmbuclmi.app.clientclub.net/courses/products/cff5b3b2-a658-422e-ba07-f1846161455e/categories/75c08d8b-cd10-4347-a56e-31bc3d93c873/posts/";
    var Q=WD_CID?("?cid="+encodeURIComponent(WD_CID)):"";
    var IDS={panou:"91ca406c-00bf-4a4c-ab24-f47971007e1c",invitati:"46f55aa5-48b0-4022-8161-5be7d1c9be34",comparator:"c4f25fbc-8b4e-4471-9748-ae9c9fb2b01f",creator:"6cbbe44b-cf37-4ed6-90c4-faa054da52d3"};
    document.querySelectorAll('[data-nav]').forEach(function(a){ var id=IDS[a.getAttribute('data-nav')]; if(id) a.href=LB+id+Q; });
  })();

  function el(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function num(v){var n=parseFloat(String(v).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}

  // ── categorii standard ──
  var STD=[
    {e:"🏛️",n:"Local & meniu"},{e:"📸",n:"Fotograf"},{e:"🎥",n:"Videograf"},
    {e:"🎵",n:"Formație / DJ"},{e:"💐",n:"Decor & flori"},{e:"🎂",n:"Tort & candy bar"},
    {e:"👗",n:"Rochie & costum"},{e:"💄",n:"Beauty (machiaj/coafură)"},
    {e:"💍",n:"Verighete"},{e:"✉️",n:"Invitații & papetărie"},{e:"🚗",n:"Transport & cazare"}
  ];

  // ── stare ──
  var D={ cur:"RON", invitati:0, rows:[] };
  var dirty=false;
  function md(){dirty=true;}

  function defaultRows(){
    return STD.map(function(c){ return {e:c.e,n:c.n,est:0,contr:0,plat:0,custom:false}; });
  }

  function load(){
    if(!WD_CID){
      el("wd-root").innerHTML='<div class="state"><div class="ic">🔒</div><h2 class="serif">Nu te-am putut identifica</h2><p>Deschide pagina din contul tău (din panou).</p></div>';
      D.rows=defaultRows(); render(); return;
    }
    fetch(WD_API+"?cid="+encodeURIComponent(WD_CID))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok){
          if(j.invitatiTotal) D.invitati=parseInt(j.invitatiTotal,10)||0;
          if(j.bugetJson&&typeof j.bugetJson==="string"&&j.bugetJson.charAt(0)==="{"){
            try{ var p=JSON.parse(j.bugetJson); if(p&&p.rows){ D=Object.assign(D,p); } }catch(e){}
          }
        }
        if(!D.rows||!D.rows.length) D.rows=defaultRows();
        render();
      })
      .catch(function(){ D.rows=defaultRows(); render(); });
  }

  function totals(){
    var est=0,contr=0,plat=0;
    D.rows.forEach(function(r){ est+=num(r.est); contr+=num(r.contr); plat+=num(r.plat); });
    return {est:est,contr:contr,plat:plat};
  }
  function fmt(v){ return Math.round(v).toLocaleString("ro-RO")+" "+D.cur; }

  function render(){
    el("wd-savebar").style.display="flex";
    var t=totals();
    var cpp = D.invitati>0 ? t.est/D.invitati : 0;

    var setup='<div class="setup">'+
      '<div class="f"><label>Număr invitați</label><input type="number" id="f-inv" value="'+(D.invitati||"")+'" placeholder="ex. 120"/></div>'+
      '<div class="f"><label>Monedă</label><div class="cur-toggle">'+
        '<button data-cur="RON" class="'+(D.cur==="RON"?"on":"")+'">RON</button>'+
        '<button data-cur="EUR" class="'+(D.cur==="EUR"?"on":"")+'">EUR</button>'+
      '</div></div>'+
    '</div>';

    var summary='<div class="summary">'+
      '<div class="sc est"><div class="l">Total estimat</div><div class="v">'+fmt(t.est)+'</div></div>'+
      '<div class="sc contr"><div class="l">Contractat</div><div class="v">'+fmt(t.contr)+'</div></div>'+
      '<div class="sc plat"><div class="l">Achitat</div><div class="v">'+fmt(t.plat)+'</div></div>'+
      '<div class="sc cpp"><div class="l">Cost / invitat</div><div class="v">'+(cpp>0?fmt(cpp):"—")+'</div></div>'+
    '</div>';

    var head='<div class="cat-head"><span>Categorie</span><span>Estimat</span><span>Contractat</span><span>Achitat</span></div>';
    var rows='';
    D.rows.forEach(function(r,i){
      var nameCell = r.custom
        ? '<div class="cat-name"><button class="cat-del" data-del="'+i+'" title="Șterge">✕</button><input type="text" data-name="'+i+'" value="'+esc(r.n)+'" placeholder="Categoria ta"/></div>'
        : '<div class="cat-name"><span class="ce">'+r.e+'</span>'+esc(r.n)+'</div>';
      rows+='<div class="cat-row'+(r.custom?' custom':'')+'">'+
        nameCell+
        '<input type="number" data-f="est" data-i="'+i+'" value="'+(r.est||"")+'" placeholder="0"/>'+
        '<input type="number" data-f="contr" data-i="'+i+'" value="'+(r.contr||"")+'" placeholder="0"/>'+
        '<input type="number" data-f="plat" data-i="'+i+'" value="'+(r.plat||"")+'" placeholder="0"/>'+
      '</div>';
    });

    var add='<div class="add-row"><button id="wd-add">＋ Adaugă o categorie</button></div>';

    var alert='';
    if(t.contr>0||t.est>0){
      if(t.contr>t.est && t.est>0){
        alert='<div class="alert over">⚠️ Ai contractat '+fmt(t.contr-t.est)+' peste estimat. Vezi unde poți ajusta.</div>';
      } else if(t.est>0){
        alert='<div class="alert ok">✓ Te încadrezi în estimat. Mai ai '+fmt(t.est-t.contr)+' nealocați.</div>';
      }
    }

    var bottom='<div class="bottom-bar">'+
      '<a class="btn-back" data-nav="panou" href="#">⌂ Înapoi la panou</a>'+
      '<a class="btn-back" data-nav="invitati" href="#">👥 Tracker invitați</a>'+
      '<a class="btn-back" data-nav="comparator" href="#">⚖️ Comparator</a>'+
      '<a class="btn-back" href="https://vsu1yqyciwfpxmbuclmi.app.clientclub.net/courses/products/cff5b3b2-a658-422e-ba07-f1846161455e" target="_top">← Înapoi la video</a>'+
    '</div>';

    el("wd-root").innerHTML=setup+summary+'<div class="cats">'+head+rows+'</div>'+add+alert+bottom;
    bind();
  }

  function bind(){
    var root=el("wd-root");
    var fi=el("f-inv"); if(fi) fi.oninput=function(){ D.invitati=parseInt(fi.value,10)||0; md(); softSummary(); };
    root.querySelectorAll('[data-cur]').forEach(function(b){ b.onclick=function(){ D.cur=b.dataset.cur; md(); render(); }; });
    root.querySelectorAll('input[data-f]').forEach(function(inp){
      inp.oninput=function(){ var i=+inp.dataset.i; D.rows[i][inp.dataset.f]=num(inp.value); md(); softSummary(); };
    });
    root.querySelectorAll('input[data-name]').forEach(function(inp){
      inp.oninput=function(){ D.rows[+inp.dataset.name].n=inp.value; md(); };
    });
    root.querySelectorAll('[data-del]').forEach(function(b){
      b.onclick=function(){ D.rows.splice(+b.dataset.del,1); md(); render(); };
    });
    var add=el("wd-add"); if(add) add.onclick=function(){ D.rows.push({e:"•",n:"",est:0,contr:0,plat:0,custom:true}); md(); render(); };
    // re-leg navigarea (butoane noi)
    var LB="https://vsu1yqyciwfpxmbuclmi.app.clientclub.net/courses/products/cff5b3b2-a658-422e-ba07-f1846161455e/categories/75c08d8b-cd10-4347-a56e-31bc3d93c873/posts/";
    var Q=WD_CID?("?cid="+encodeURIComponent(WD_CID)):"";
    var IDS={panou:"91ca406c-00bf-4a4c-ab24-f47971007e1c",invitati:"46f55aa5-48b0-4022-8161-5be7d1c9be34",comparator:"c4f25fbc-8b4e-4471-9748-ae9c9fb2b01f",creator:"6cbbe44b-cf37-4ed6-90c4-faa054da52d3"};
    root.querySelectorAll('[data-nav]').forEach(function(a){ var id=IDS[a.getAttribute('data-nav')]; if(id) a.href=LB+id+Q; });
  }

  // update doar sumar+alerta fara re-render (nu pierzi focus pe input)
  function softSummary(){
    var t=totals(); var cpp=D.invitati>0?t.est/D.invitati:0;
    var sc=document.querySelectorAll('#wd-buget .summary .sc .v');
    if(sc.length>=4){ sc[0].textContent=fmt(t.est); sc[1].textContent=fmt(t.contr); sc[2].textContent=fmt(t.plat); sc[3].textContent=cpp>0?fmt(cpp):"—"; }
    var a=document.querySelector('#wd-buget .alert');
    if(a){
      a.className="alert";
      if(t.contr>t.est&&t.est>0){ a.className="alert over"; a.textContent="⚠️ Ai contractat "+fmt(t.contr-t.est)+" peste estimat. Vezi unde poți ajusta."; }
      else if(t.est>0){ a.className="alert ok"; a.textContent="✓ Te încadrezi în estimat. Mai ai "+fmt(t.est-t.contr)+" nealocați."; }
    }
  }

  function save(){
    if(!WD_CID){ alert("Nu te pot identifica — deschide din panou."); return; }
    var b=el("wd-save"); b.disabled=true; el("wd-status").textContent="Se salvează...";
    var t=totals();
    // salvez JSON-ul detaliat + sincronizez cifrele de sumar pe campuri separate (pt panou)
    var body={
      bugetJson: JSON.stringify(D),
      bugetEstimat: Math.round(t.est),
      bugetReal: Math.round(t.plat),
      bugetDiferenta: Math.round(t.est-t.contr)
    };
    fetch(WD_API+"?cid="+encodeURIComponent(WD_CID),{
      method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)
    })
    .then(function(r){return r.json();})
    .then(function(j){
      b.disabled=false;
      if(j&&(j.ok||j.salvat)){ el("wd-status").textContent="✓ Salvat!"; dirty=false; setTimeout(function(){el("wd-status").textContent="";},2500); }
      else el("wd-status").textContent="✕ Nu s-a salvat. Mai încearcă.";
    })
    .catch(function(){ b.disabled=false; el("wd-status").textContent="✕ Eroare. Mai încearcă."; });
  }

  el("wd-save").onclick=save;
  window.addEventListener("beforeunload",function(e){ if(dirty){ e.preventDefault(); e.returnValue=""; } });
  load();
})();
</script>









<script>
/* WD: raportez inaltimea reala catre portal (mobil-friendly, ResizeObserver) */
(function(){
  var lastSent = 0;
  function calcH(){
    return Math.max(
      document.body.scrollHeight, document.documentElement.scrollHeight,
      document.body.offsetHeight, document.documentElement.offsetHeight
    );
  }
  function reportHeight(){
    try {
      var h = calcH();
      if (Math.abs(h - lastSent) > 15 && h > 100) {
        lastSent = h;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ wdHeight: h }, "*");
        }
      }
    } catch(e){}
  }
  // raportez la load
  if (document.readyState === "complete") setTimeout(reportHeight, 200);
  else window.addEventListener("load", function(){ setTimeout(reportHeight, 200); });
  // ResizeObserver: raporteaza ORI DE CATE ORI se schimba inaltimea (tab nou, rubrica, etc.)
  try {
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(function(){ reportHeight(); });
      ro.observe(document.body);
    }
  } catch(e){}
  // fallback: verific periodic (rar, doar ca plasa de siguranta)
  setInterval(reportHeight, 1000);
  // raportez si la orice click/input (cand mireasa interactioneaza)
  document.addEventListener("click", function(){ setTimeout(reportHeight, 250); });
  document.addEventListener("input", function(){ setTimeout(reportHeight, 250); });
})();
</script>

</body>
</html>
